name: ISS
description: "ISS.AI"
publish_to: "none"

version: 2.2.1+27

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  picovoice_flutter: ^3.0.4
  rhino_flutter: ^3.0.4
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  flutter_dotenv: ^6.0.0
  video_player: ^2.10.0
  # UI / навигация / утилиты
  pinput: ^5.0.0
  liquid_glass_renderer: ^0.1.1-dev.10
  uuid: ^4.4.2
  equatable: ^2.0.7
  flutter_vlc_player: ^7.4.2
  image_picker: ^1.0.4
  go_router: ^16.2.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.0
  flutter_staggered_grid_view: ^0.7.0
  mask_text_input_formatter: ^2.4.0
  flutter_image_compress: ^2.1.0
  collection: ^1.17.1
  intl: ^0.20.2
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.23.0

  # Гео/фон/пермишены/безопасность/сеть
  geolocator: ^14.0.2
  background_fetch: 1.4.0
  permission_handler: ^12.0.1
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  network_info_plus: ^6.1.4
  wifi_scan: ^0.4.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.3.6

  # Notifications
  flutter_local_notifications: ^19.4.1

  # Firebase (оставляем текущие мажоры)
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # Локализация
  flutter_localizations:
    sdk: flutter

  # Splash / иконки
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

  # Разное
  app_settings: ^6.1.1
  sms_autofill: ^2.3.0

  http_parser: any
  path: any
  http: any
  path_provider: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/users.json
    - assets/data/subscription.json
    - assets/data/payments.json
    - assets/images/logo.svg
    - assets/images/logo.png
    - assets/images/splashLogo.png
    - assets/images/splash.png
    - assets/images/logo1.PNG
    - assets/images/newSplashLogo.png
    - assets/images/iosSplash.jpeg
    - assets/images/ios.png
    - assets/images/android_icon.png
    - assets/images/home_background.jpg
    - .env
    - assets/picovoice/
    - assets/devices/lamp.png
    - assets/devices/door.png
    - assets/devices/relay.png
    - assets/devices/movement.png
    - assets/devices/presence.png
    - assets/devices/env.png
    - assets/devices/leak.png
    - assets/devices/curtain.png
    - assets/devices/vibration.png
    - assets/devices/generic.png
flutter_native_splash:
  color: "#000000"
  android_12:
    icon_background_color: "#000000"

flutter_icons:
  android: true
  ios: true
  image_path_android: "assets/images/ios_icon.png"
  image_path_ios: "assets/images/ios_icon.png"
  remove_alpha_ios: true
